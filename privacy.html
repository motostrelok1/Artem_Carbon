<!doctype html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARTEMS CARBON — Политика обработки персональных данных</title>
<link rel="stylesheet" href="./styles.css">
<style>
.privacy-page{min-height:100vh;background:linear-gradient(100deg,rgba(3,4,8,.88),rgba(3,4,8,.5)),url('./hero-car.jpg') center/cover fixed;color:#fff}
.privacy-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px clamp(18px,5vw,80px);background:rgba(7,7,11,.75);border-bottom:1px solid #ffffff33;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.privacy-header .logo{font-size:clamp(20px,3vw,30px)}
.privacy-back{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:11px 16px}
.privacy-back:hover{border-color:#f22532}
.privacy-main{width:min(100% - 32px,1000px);margin:clamp(32px,5vw,70px) auto 80px}
.privacy-main .eyebrow{color:#ff4555}
.privacy-main h1{font-size:clamp(32px,5vw,60px);line-height:1.04;margin:14px 0 32px}
.privacy-content{min-height:340px;background:rgba(15,16,22,.9);border:1px solid #ffffff3d;padding:clamp(20px,4vw,44px);box-shadow:0 12px 38px #0009}
.privacy-content h2{font-size:clamp(20px,3vw,26px);margin:0 0 18px}
.privacy-content p{color:#dedee2;font-size:16px;line-height:1.7;max-width:75ch}
.privacy-note{border-left:3px solid #f22532;padding-left:18px}
@media(max-width:650px){.privacy-header{flex-wrap:wrap}.privacy-back{font-size:13px}}
</style></head>
<body class="privacy-page">
<header class="privacy-header"><a class="logo" href="./">ARTEMS <em>CARBON</em></a><a class="privacy-back" href="./">← ВЕРНУТЬСЯ НА САЙТ</a></header>
<main class="privacy-main">
<p class="eyebrow">ARTEMS CARBON / ДОКУМЕНТЫ</p>
<h1>ПОЛИТИКА <span style="color:#f22532">ПЕРСОНАЛЬНЫХ ДАННЫХ</span></h1>
<section class="privacy-content" aria-labelledby="policyHeading">
<h2 id="policyHeading">Политика сбора, обработки и хранения персональных данных</h2>
<p class="privacy-note">Текст политики будет размещён здесь после утверждения владельцем проекта.</p>
</section>
</main></body></html>
