# Artem Carbon API protection — observation phase only.
# Loaded in nginx's http {} via /etc/nginx/conf.d/*.conf.
# Do not turn off dry-run until rate-limit counters and payment callbacks have been reviewed.
limit_req_zone $binary_remote_addr zone=ac_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=ac_admin_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=ac_api_connections:10m;

# This access log intentionally excludes query strings, request bodies and cookies.
# Incoming IP addresses are recorded to investigate false positives; keep retention short.
log_format ac_antiflood '$remote_addr [$time_iso8601] $host "$request_method $uri" '
                        'status=$status req=$request_time upstream=$upstream_response_time '
                        'req_limit=$limit_req_status conn_limit=$limit_conn_status';
